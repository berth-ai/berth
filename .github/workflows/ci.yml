name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke:
        description: Run the image smoke test (slow; off on pushes and pull requests)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      # Lint tools come from the image's base-track pins.
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/tools/mise.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25 # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.*)$
          install_args: shellcheck hadolint actionlint
      - name: Shell syntax and ShellCheck
        run: |
          mapfile -t files < <(git ls-files 'rootfs/usr/local/bin/*' 'rootfs/usr/local/lib/berth/*.sh' \
            'rootfs/etc/berth/services.d/*.sh' 'build/*.sh' 'tests/*.sh')
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck -x "${files[@]}"
      - name: hadolint
        run: hadolint --failure-threshold error Dockerfile
      - name: actionlint
        run: actionlint
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0 # renovate: datasource=github-releases depName=golangci/golangci-lint

  web:
    runs-on: ubuntu-24.04
    env:
      # Node comes from the image's base-track pin.
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/tools/mise.toml
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25 # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.*)$
          install_args: node
      - name: Install
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Format
        run: pnpm fmt:check
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Generated route tree is committed
        run: git diff --exit-code -- src/routeTree.gen.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error

  go-test:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  e2e:
    needs: web
    runs-on: ubuntu-24.04
    env:
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/tools/mise.toml
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25 # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.*)$
          install_args: node
      - name: Install
        run: corepack enable && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Smoke test
        run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report

  shell-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh for the shell-defaults tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: unittest
        run: python3 -m unittest discover -s tests -v

  image:
    name: image-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compose config
        run: |
          docker compose config -q
          cp .env.example .env && docker compose config -q && rm .env
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: berth:ci
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }},ignore-error=true
          build-args: |
            BERTH_VERSION=0.0.0-ci
            BERTH_COMMIT=${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test
        if: inputs.smoke
        run: tests/smoke-image.sh berth:ci
