name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      # Lint tools come from the image's base-track pins.
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/tools/mise.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17 # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.*)$
          install_args: shellcheck hadolint actionlint
      - name: Shell syntax and ShellCheck
        run: |
          mapfile -t files < <(git ls-files 'rootfs/usr/local/bin/*' 'rootfs/usr/local/lib/berth/*.sh' \
            'rootfs/etc/berth/services.d/*.sh' 'build/*.sh' 'tests/*.sh')
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck -x "${files[@]}"
      - name: hadolint
        run: hadolint --failure-threshold error Dockerfile
      - name: actionlint
        run: actionlint
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0 # renovate: datasource=github-releases depName=golangci/golangci-lint

  go-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  shell-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh for the shell-defaults tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: unittest
        run: python3 -m unittest discover -s tests -v

  image:
    name: image-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compose config
        run: cp .env.example .env && docker compose config -q
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: berth:ci
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
          build-args: |
            BERTH_VERSION=0.0.0-ci
            BERTH_COMMIT=${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test
        run: tests/smoke-image.sh berth:ci
