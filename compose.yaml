# Berth: one container, reachable only on BIND_ADDRESS.
# Copy .env.example to .env, set BIND_ADDRESS and at least one frontend credential.
name: berth

services:
  berth:
    image: ghcr.io/salgnt/berth:${BERTH_VERSION:?set BERTH_VERSION in .env}
    # build: .   # uncomment to build locally instead of pulling
    init: false # tini is PID 1 inside the image
    restart: unless-stopped
    env_file: .env
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_ADDRESS:?set BIND_ADDRESS to a private address}:${TTYD_PORT:-7681}:${TTYD_PORT:-7681}"
      - "${BIND_ADDRESS:?set BIND_ADDRESS to a private address}:${CODE_SERVER_PORT:-8080}:${CODE_SERVER_PORT:-8080}"
    volumes:
      - berth-home:/home/agent
      - berth-agents:/opt/agents
      - ${WORKSPACES_DIR:-./workspaces}:/workspaces

# Explicit names, so renaming the project directory cannot orphan them.
# Never use `docker compose down -v` to upgrade: it deletes both.
volumes:
  berth-home:
    name: berth-home
  berth-agents:
    name: berth-agents
