# Berth: one container. No .env is needed; every variable below is optional.
# After `docker compose up -d`, open the setup link from `docker compose logs berth`.
name: berth

services:
  berth:
    # renovate: datasource=docker depName=ghcr.io/salgnt/berth
    image: ghcr.io/salgnt/berth:${BERTH_VERSION:-0.1.0}
    # build: .   # uncomment to build locally instead of pulling
    init: false # tini is PID 1 inside the image
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Shown read-only in the panel; the setup link is built from them.
      BERTH_HOST_BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
      BERTH_HOST_PANEL_PORT: ${PANEL_PORT:-7690}
      BERTH_HOST_PUID: ${PUID:-1000}
      BERTH_HOST_PGID: ${PGID:-1000}
      BERTH_HOST_WORKSPACES_DIR: ${WORKSPACES_DIR:-./workspaces}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PANEL_PORT:-7690}:7690"
    volumes:
      - berth-home:/home/agent
      - berth-agents:/opt/agents
      - berth-config:/var/lib/berth
      - ${WORKSPACES_DIR:-./workspaces}:/workspaces

# Explicit names, so renaming the project directory cannot orphan them.
# Never use `docker compose down -v` to upgrade: it deletes them all.
volumes:
  berth-home:
    name: berth-home
  berth-agents:
    name: berth-agents
  berth-config:
    name: berth-config
