<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up · Berth</title>
<link rel="stylesheet" href="/static/panel.css">
<script src="/static/auth.js" defer></script>
</head>
<body class="auth">
<main>
  <h1>Berth</h1>
  <p id="no-token" class="banner" hidden>Open the setup link printed in the container log:
    <code>docker compose logs berth | grep setup</code></p>
  <form id="setup-form" class="card">
    <h2>Create the panel login</h2>
    <label>User <input id="user" name="user" autocomplete="username" required maxlength="64"></label>
    <label>Password <input id="password" type="password" autocomplete="new-password" required minlength="10" maxlength="256"></label>
    <label>Repeat password <input id="password2" type="password" autocomplete="new-password" required></label>
    <fieldset>
      <legend>Frontends</legend>
      <label><input id="terminal" type="checkbox" checked> Browser terminal</label>
      <label><input id="ide" type="checkbox"> Browser IDE (code-server)</label>
    </fieldset>
    <p id="error" class="error" role="alert" hidden></p>
    <button id="submit" type="submit">Finish setup</button>
  </form>
</main>
</body>
</html>
