version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - unconvert
  exclusions:
    # Unchecked fmt.Fprint* to human output and Close on read-only files are
    # conventional; errors that matter (writes, renames) are still checked.
    presets:
      - std-error-handling
    rules:
      # Test setup ignores errors from fixture writes on purpose; failures
      # surface in the assertions that follow.
      - path: _test\.go
        linters: [errcheck]
      # The panel tests' do helper reads and closes every body before it
      # returns the response for its status and headers.
      - path: internal/panel/.*_test\.go
        linters: [bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/berth-ai/bert
