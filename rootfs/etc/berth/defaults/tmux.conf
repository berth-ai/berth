# Berth's default tmux configuration. Create ~/.tmux.conf to replace it.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on

# Layouts survive container recreation; running processes do not.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run-shell /usr/share/berth/tmux-plugins/tmux-resurrect/resurrect.tmux
run-shell /usr/share/berth/tmux-plugins/tmux-continuum/continuum.tmux
