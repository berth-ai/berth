# Berth's default Starship prompt. Create ~/.config/starship.toml to replace it.
add_newline = false
format = "$username$hostname$directory$git_branch$git_status$nodejs$python$golang$cmd_duration$line_break$character"

[hostname]
ssh_only = false
format = "[$hostname]($style) "

[directory]
truncation_length = 4

[cmd_duration]
min_time = 2000
